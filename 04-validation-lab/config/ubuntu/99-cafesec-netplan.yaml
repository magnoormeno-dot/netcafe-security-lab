# 99-cafesec-netplan.yaml
# [CSL-Wazuh (Ubuntu Server 24.04 LTS, 10.10.10.10) isolated-network static address]
# ------------------------------------------------------------------
# Place on the client machine at:  /etc/netplan/99-cafesec-netplan.yaml
# Apply with:                      sudo netplan apply        (run `sudo netplan try` first to verify it won't drop your session)
#
# Design notes (purely defensive / fully isolated):
#   - Static 10.10.10.10/24, matching CSL-Wazuh.IP in config\lab.psd1.
#   - [Intentionally] no gateway / routes (no default gateway) -- nothing leaves at layer 3, an extra layer of isolation insurance.
#   - [Intentionally] no nameservers (the isolated network has no DNS). If VMs need hostnames, put them in /etc/hosts.
#   - This is the phase-two configuration of the "two-phase build": after phase one temporarily connects to the network
#     to install Wazuh/patches, switch the NIC back to the CafeSec-Isolated (Private) switch, apply this file, then run the
#     isolation validation script to confirm compliance.
#
# !!! IMPORTANT: confirm the NIC name first !!!
#   Modern Ubuntu uses predictable interface names (ens* / enp*), no longer eth0. Check the actual name first:
#       ip link            # or:  ip -br link
#   Common examples: Hyper-V Gen2 VMs are often eth0 or enp0s* / ens*; trust the `ip link` output.
#   Change the ens3 below to the real NIC name on your machine, otherwise the configuration will not take effect.
#
# netplan note: YAML uses space indentation (no Tabs); the renderer on this host is usually systemd-networkd.
network:
  version: 2
  renderer: networkd
  ethernets:
    ens3:                          # <-- change to the real NIC name found via `ip link` (ens*/enp*/eth0)
      dhcp4: false                 # the isolated network has no DHCP, use a static address
      dhcp6: false
      accept-ra: false             # do not accept IPv6 router advertisements (avoids accidentally acquiring a default route)
      link-local: []               # no IPv4/IPv6 link-local addresses, keep the network surface minimal
      addresses:
        - 10.10.10.10/24           # this host's isolated-network address (= lab.psd1 CSL-Wazuh.IP)
      # ----------------------------------------------------------------
      # The following are [all intentionally omitted] -- this is part of the isolation, do not uncomment:
      #   routes:        (no default route)
      #   gateway4:      (deprecated syntax; likewise not configured)
      #   nameservers:   (the isolated network has no DNS)
      # ----------------------------------------------------------------
