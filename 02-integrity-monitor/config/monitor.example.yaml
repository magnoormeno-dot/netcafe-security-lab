# CafeSec Integrity Monitor example configuration.
# Copy this file and adjust paths before use.

targets:
  - "C:\\CafeBilling"
  - "C:\\Program Files\\CafeBilling\\**\\*.exe"
  - "C:\\Program Files\\CafeBilling\\**\\*.dll"
  - "C:\\ProgramData\\CafeBilling\\config\\*.json"

excludes:
  - "*.log"
  - "*.tmp"
  - "*\\cache\\*"

algorithms:
  - sha256
  - blake3

# --alert-file on the command line overrides alerting.file.
alerting:
  dedup_window_seconds: 900
  file: "C:\\CafeSec\\alerts.jsonl"

process_monitor:
  protected_process_keywords:
    - billing
    - cashier
    - clientagent
    - rollback
    - restore
    - watchdog

# Only classic logs can be read (names without a "/"). Channels such as
# Microsoft-Windows-PowerShell/Operational are skipped with a warning.
# state_file keeps event-log bookmarks between runs of `monitor --once`.
event_analyzer:
  channels:
    - Security
    - System
  state_file: "C:\\CafeSec\\event-state.json"
