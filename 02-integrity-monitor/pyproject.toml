[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cafesec-integrity-monitor"
version = "0.1.0"
description = "Defensive integrity monitoring for internet cafe and gaming venue environments."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "CafeSec Lab Research Team", email = "research@cafeseclab.com" }
]
keywords = ["security", "integrity", "monitoring", "windows", "internet-cafe"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Security",
  "Topic :: System :: Monitoring",
]
dependencies = [
  "blake3>=0.4.1",
  "click>=8.1.7",
  "psutil>=5.9.8",
  "PyYAML>=6.0.1",
  "requests>=2.31.0",
]

[project.optional-dependencies]
windows = [
  "pywin32>=306; platform_system == 'Windows'",
  "python-evtx>=0.7.4",
]
dev = [
  "mypy>=1.10.0",
  "pytest>=8.2.0",
  "pytest-cov>=5.0.0",
  "responses>=0.25.0",
  "ruff>=0.4.8",
  "types-PyYAML>=6.0.12",
  "types-requests>=2.31.0",
]

[project.scripts]
integrity-monitor = "integrity_monitor.cli:main"

[project.urls]
Homepage = "https://cafeseclab.com/"
Documentation = "https://research.cafeseclab.com/"
Repository = "https://github.com/magnoormeno-dot/netcafe-security-lab"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "C4", "SIM", "RUF"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "ANN001", "S101"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unreachable = true
disallow_any_generics = true
no_implicit_optional = true
show_error_codes = true

[[tool.mypy.overrides]]
module = ["psutil", "blake3", "win32evtlog", "win32con", "Evtx.*", "responses"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "--cov=integrity_monitor --cov-report=term-missing --cov-report=xml --cov-fail-under=85"
testpaths = ["tests"]
