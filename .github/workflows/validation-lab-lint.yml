name: Validation Lab CI

on:
  push:
    branches: [main]
    paths:
      - '04-validation-lab/**'
      - '01-hardening-checklist/detection/**'
      - '.github/workflows/validation-lab-lint.yml'
  pull_request:
    branches: [main]
    paths:
      - '04-validation-lab/**'
      - '01-hardening-checklist/detection/**'
      - '.github/workflows/validation-lab-lint.yml'
  # Weekly health sweep: re-runs lint + Pester + rule-validation so toolchain drift
  # (e.g. a sigma-cli backend rename, a YARA release change) is caught automatically.
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: PSScriptAnalyzer (Windows PowerShell 5.1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell   # Windows PowerShell 5.1 — the scripts' real target runtime

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Ensure PSScriptAnalyzer
        run: |
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          }
          Import-Module PSScriptAnalyzer
          (Get-Module PSScriptAnalyzer).Version

      - name: PSScriptAnalyzer
        run: |
          $ErrorActionPreference = 'Stop'
          $mod = '04-validation-lab'
          $settings = Join-Path $mod 'PSScriptAnalyzerSettings.psd1'
          Import-Module PSScriptAnalyzer
          $scripts = Get-ChildItem $mod -Recurse -Filter *.ps1
          Write-Host "Analyzing $($scripts.Count) PowerShell scripts in $mod ..."
          $findings = Invoke-ScriptAnalyzer -Path $mod -Recurse -Settings $settings
          if ($findings) {
            $findings | Sort-Object ScriptName, Line |
              Select-Object Severity, RuleName, @{n='File';e={Resolve-Path -Relative $_.ScriptName}}, Line, Message |
              Format-Table -AutoSize | Out-String -Width 240 | Write-Host
            foreach ($f in $findings) {
              Write-Host "::error file=$($f.ScriptName),line=$($f.Line)::[$($f.RuleName)] $($f.Message)"
            }
            throw "PSScriptAnalyzer reported $($findings.Count) issue(s)."
          }
          Write-Host "PSScriptAnalyzer: clean ($($scripts.Count) scripts)."

      - name: UTF-8 BOM + parse check
        run: |
          $ErrorActionPreference = 'Stop'
          $mod = '04-validation-lab'
          $scripts = Get-ChildItem $mod -Recurse -Filter *.ps1
          $noBom = @(); $parseErrors = 0
          foreach ($s in $scripts) {
            $b = [System.IO.File]::ReadAllBytes($s.FullName)
            if (-not ($b.Length -ge 3 -and $b[0] -eq 0xEF -and $b[1] -eq 0xBB -and $b[2] -eq 0xBF)) {
              $noBom += $s.FullName
              Write-Host "::error file=$($s.FullName)::missing UTF-8 BOM (Windows PowerShell 5.1 reads BOM-less non-ASCII scripts as ANSI/GBK and fails to parse)"
            }
            $err = $null
            [System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$null, [ref]$err) | Out-Null
            if ($err.Count) {
              $parseErrors += $err.Count
              Write-Host "::error file=$($s.FullName),line=$($err[0].Extent.StartLineNumber)::$($err[0].Message)"
            }
          }
          if ($noBom.Count -or $parseErrors) {
            throw "BOM/parse check failed: bomMissing=$($noBom.Count) parseErrors=$parseErrors"
          }
          Write-Host "BOM + parse: all $($scripts.Count) scripts OK."

  test:
    name: Pester (Windows PowerShell 5.1)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Ensure Pester 5
        run: |
          if (-not (Get-Module -ListAvailable Pester | Where-Object { $_.Version.Major -ge 5 })) {
            Install-Module Pester -MinimumVersion 5.5.0 -Force -SkipPublisherCheck -Scope CurrentUser
          }
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          (Get-Module Pester).Version

      - name: Run Pester
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Pester -MinimumVersion 5.0.0 -Force
          $c = New-PesterConfiguration
          $c.Run.Path = '04-validation-lab/tests'
          $c.Run.PassThru = $true
          $c.Output.Verbosity = 'Detailed'
          $c.TestResult.Enabled = $true
          $c.TestResult.OutputPath = 'pester-results.xml'
          $c.CodeCoverage.Enabled = $true
          $c.CodeCoverage.Path = '04-validation-lab/scripts/lib/LabLogic.psm1'
          $c.CodeCoverage.OutputPath = 'coverage.xml'
          $r = Invoke-Pester -Configuration $c
          if ($r.FailedCount -gt 0) { throw "$($r.FailedCount) Pester test(s) failed." }
          $cov = [math]::Round($r.CodeCoverage.CoveragePercent, 1)
          Write-Host "LabLogic.psm1 coverage: $cov%"
          if ($cov -lt 90) { throw "Coverage $cov% is below the 90% gate." }
          Write-Host "Pester: $($r.PassedCount) passed; coverage gate (>=90%) met."

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pester-results
          path: |
            pester-results.xml
            coverage.xml

  shellcheck:
    name: ShellCheck (bash helpers)
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: ShellCheck
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(04-validation-lab/scripts/wazuh/*.sh)
          if [ ${#files[@]} -eq 0 ]; then echo "no shell scripts"; exit 0; fi
          echo "Checking: ${files[*]}"
          shellcheck "${files[@]}"

  rule-validation:
    name: Rule validation (Sigma convert + YARA compile)
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install sigma-cli + opensearch backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli
          sigma plugin install opensearch

      - name: Download YARA (VirusTotal/yara latest win64)
        run: |
          $ErrorActionPreference = 'Stop'
          [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
          $tools = '04-validation-lab/downloads/tools'
          New-Item -ItemType Directory -Force -Path $tools | Out-Null
          $rel = Invoke-RestMethod 'https://api.github.com/repos/VirusTotal/yara/releases/latest' -Headers @{ 'User-Agent' = 'cafesec-lab-ci' }
          $asset = $rel.assets | Where-Object { $_.name -like '*win64.zip' } | Select-Object -First 1
          $zip = Join-Path $env:RUNNER_TEMP $asset.name
          Invoke-WebRequest $asset.browser_download_url -OutFile $zip -Headers @{ 'User-Agent' = 'cafesec-lab-ci' }
          Expand-Archive $zip -DestinationPath $tools -Force
          & "$tools/yara64.exe" --version

      - name: Validate detection rules and gate on any failure
        run: |
          $ErrorActionPreference = 'Stop'
          & '04-validation-lab/scripts/analysis/Invoke-RuleValidation.ps1'
          $latest = Get-ChildItem '04-validation-lab/reports' -Filter 'rule-validation-*.jsonl' |
            Sort-Object Name -Descending | Select-Object -First 1
          if (-not $latest) { throw 'No rule-validation report was produced.' }
          $rows = Get-Content $latest.FullName | Where-Object { $_.Trim() } | ForEach-Object { $_ | ConvertFrom-Json }
          $rows | ForEach-Object { Write-Host ("{0,-6} {1,-45} {2}" -f $_.kind, $_.rule, $(if ($_.ok) { 'PASS' } else { 'FAIL' })) }
          $failed = @($rows | Where-Object { -not $_.ok })
          if ($failed.Count) {
            foreach ($f in $failed) { Write-Host "::error::rule $($f.rule) failed: $($f.detail)" }
            throw "$($failed.Count) detection rule(s) failed to convert/compile."
          }
          Write-Host "All $($rows.Count) detection rules converted/compiled cleanly."

      - name: Regenerate CVP evidence and verify it is not a stub
        run: |
          $ErrorActionPreference = 'Stop'
          & '04-validation-lab/scripts/analysis/Export-CvpEvidence.ps1'
          $ev = Get-Content 'docs/cvp/lab-validation-evidence.md' -Raw
          if ($ev -match 'STATUS: STUB') { throw 'Evidence still marked STUB after a successful validation run.' }
          Write-Host 'CVP evidence regenerated from a real, all-pass rule-validation report.'

      - name: Upload rule-validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rule-validation-report
          path: 04-validation-lab/reports/*
