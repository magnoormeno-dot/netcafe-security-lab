title: Anomalous Registry Modification Affecting Venue Control Or Security
id: e1fc50ea-ae34-4d37-8ae1-854551ddf4ac
status: experimental
description: >
  Detects registry modifications in locations that commonly affect startup,
  security policy, proxy settings, DNS behavior, Defender, PowerShell logging,
  AppLocker, and billing software configuration. In a gaming venue, these
  changes should be rare outside approved deployment or support windows and
  should be correlated with user, process, and host role.
author: CafeSec Lab Research Team
date: 2026/05/13
modified: 2026/11/09
license: MIT
references:
  - https://attack.mitre.org/techniques/T1112/
  - https://attack.mitre.org/techniques/T1547/
  - https://attack.mitre.org/techniques/T1562/001/
  - https://learn.microsoft.com/windows/security/threat-protection/auditing/event-4657
tags:
  - attack.defense_evasion
  - attack.persistence
  - attack.t1112
  - attack.t1547
  - attack.t1562.001
logsource:
  product: windows
  service: security
detection:
  registry_event:
    EventID: 4657
  # Each change_* block pairs a key with the values that matter under it. A
  # single shared value-name list does not work: autorun entries and AppLocker
  # rules carry arbitrary value names, so they would never match it.
  #
  # Any value written under these keys is relevant.
  change_autorun:
    ObjectName|contains:
      - '\Software\Microsoft\Windows\CurrentVersion\Run'
      - '\Software\Microsoft\Windows\CurrentVersion\RunOnce'
      - '\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Run'
  change_applocker_policy:
    ObjectName|contains: '\Software\Policies\Microsoft\Windows\SrpV2'
  # These keys hold many unrelated values, so only the ones that disable,
  # redirect, or repoint something are watched.
  change_service_config:
    ObjectName|contains: '\System\CurrentControlSet\Services\'
    ObjectValueName|contains:
      - 'ImagePath'
      - 'Start'
  change_defender_policy:
    ObjectName|contains: '\Software\Policies\Microsoft\Windows Defender'
    ObjectValueName|contains:
      - 'DisableAntiSpyware'
      - 'DisableRealtimeMonitoring'
  change_powershell_logging:
    ObjectName|contains: '\Software\Policies\Microsoft\Windows\PowerShell'
    ObjectValueName|contains: 'EnableScriptBlockLogging'
  change_proxy_config:
    ObjectName|contains: '\Software\Microsoft\Windows\CurrentVersion\Internet Settings'
    ObjectValueName|contains: 'ProxyServer'
  change_dns_config:
    ObjectName|contains: '\System\CurrentControlSet\Services\Tcpip'
    ObjectValueName|contains: 'NameServer'
  change_billing_config:
    ObjectName|contains: '\Software\VenueBilling'
    ObjectValueName|contains:
      - 'ServerAddress'
      - 'UpdateUrl'
  # Local tuning warning:
  # The account names below are placeholders. Replace them with the exact
  # names of your maintenance accounts. Keep the match exact: a substring
  # match would also exempt any account whose name merely contains one of
  # these strings, including one created to hide a change.
  filter_approved_change:
    SubjectUserName:
      - 'svc_patch'
      - 'svc_config'
  condition: registry_event and 1 of change_* and not filter_approved_change
fields:
  - TimeCreated
  - Computer
  - SubjectUserName
  - ProcessName
  - ObjectName
  - ObjectValueName
  - NewValue
falsepositives:
  - Group Policy refreshes
  - Vendor updates during approved maintenance windows
  - Endpoint management tools applying baseline configuration
  - Initial deployment or lab testing
  - Software installers that register their own autorun entry
level: medium
