# dnsmasq-dhcp.conf  —— [OPTIONAL] Isolated-network "DHCP only, no DNS" configuration
# ============================================================================
# The default approach is [fully static IP] (see 99-cafesec-netplan.yaml and guest\Set-StaticIP.ps1),
# which is simpler and more controllable. This file is only used when you really want to serve DHCP on the isolated network —— entirely optional; you don't have to install it.
#
# Install/enable (only on CSL-Wazuh, and after confirming this host already has the static address 10.10.10.10/24):
#   sudo cp dnsmasq-dhcp.conf /etc/dnsmasq.d/cafesec-dhcp.conf
#   # On Ubuntu Server it's fine if systemd-resolved occupies port 53 —— this config uses port=0 and does not listen for DNS.
#   sudo systemctl enable --now dnsmasq
#   sudo systemctl status dnsmasq
#
# Design principles (pure defense / full isolation):
#   - [DHCP only] port=0 completely disables DNS listening: this host does not resolve, forward, or use any upstream.
#   - [Do not serve a default gateway] dhcp-option=3 (left empty) —— clients get no default route and cannot get out.
#   - [Do not serve a DNS server] dhcp-option=6 (left empty) —— clients are not pointed at any DNS.
#   - Serves only on the isolated NIC; the address pool 10.10.10.100-200 avoids the static-reserved range (.10/.20/.31/.32).
#   Note: by default dnsmasq advertises [itself] as the gateway (option 3) and DNS (option 6),
#         so the two "empty override" lines above are the key to isolation —— be sure to keep them.
# ============================================================================

# --- Disable all DNS behavior (keep DHCP only) ---
port=0                         # 0 = do not listen on 53, provide no DNS service at all
no-resolv                      # do not read /etc/resolv.conf (no upstream DNS)
no-poll                        # do not poll for resolv.conf changes
domain-needed                  # even if DNS is accidentally enabled, do not send bare-hostname queries upstream (defense in depth)
bogus-priv                     # likewise: private-network reverse lookups are not leaked outward (defense in depth)

# --- Bind only to the isolated NIC, never listen on other interfaces ---
interface=ens3                 # <-- change to the real NIC name shown by `ip link` (must match netplan)
bind-interfaces                # bind only to the interface declared above, do not take over other NICs
no-dhcp-interface=lo           # do not run DHCP on the loopback

# --- DHCP address pool: lease only, short lease time, easy to reclaim ---
# The pool range avoids the static reservations: .10=Wazuh .20=Server .31/.32=Client (see config\lab.psd1)
dhcp-range=10.10.10.100,10.10.10.200,255.255.255.0,1h
dhcp-authoritative             # the only DHCP server on this network, can respond immediately / correct bad leases

# --- [ISOLATION KEY] Do not serve a gateway or DNS (suppress via the named form; empty means "not provided") ---
# Use the named option:router / option:dns form (the "suppression" syntax documented in the dnsmasq man page),
# which is less prone than the bare numeric dhcp-option=3/6 to accidentally re-advertising the gateway due to a typo (such as an extra comma) —— this is the key defense in depth for the air gap.
dhcp-option=option:router      # default gateway -> empty = not served = clients have no default route
dhcp-option=option:dns-server  # DNS server -> empty = not served = clients have no DNS
# (Does not serve option 119 domain search / option 15 domain name, keeping the network surface minimal.)

# --- Logging (for lease troubleshooting; comment out as needed) ---
log-dhcp                       # log every DISCOVER/OFFER/REQUEST/ACK
# The lease file is located by default at /var/lib/misc/dnsmasq.leases
