name: Detection Rule Validation (offline)

# Enforces the offline rung of 04-validation-lab seam #1: every Sigma rule must convert (opensearch
# backend, lucene target, ecs_windows pipeline) and every YARA rule must compile. This needs no VM /
# Hyper-V and runs on every change to the detection content. Live-fire (rule fires on real telemetry)
# is a separate, manual, in-lab step and is NOT claimed by this gate.

on:
  push:
    branches: [main]
    paths:
      - '01-hardening-checklist/detection/**'
      - '.github/workflows/validation-lab-rules.yml'
  pull_request:
    branches: [main]
    paths:
      - '01-hardening-checklist/detection/**'
      - '.github/workflows/validation-lab-rules.yml'

permissions:
  contents: read

jobs:
  rules:
    name: Sigma convert + YARA compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install rule engines
        run: |
          python -m pip install --upgrade pip
          python -m pip install sigma-cli pysigma-pipeline-windows
          sigma plugin install opensearch
          sudo apt-get update && sudo apt-get install -y yara
          sigma version
          yara --version

      - name: Validate detection rules (convert + compile)
        run: |
          set -uo pipefail
          fail=0; total=0
          echo "::group::Sigma -> lucene (ecs_windows)"
          for f in 01-hardening-checklist/detection/sigma/*.yml; do
            case "$f" in *example*) continue ;; esac
            total=$((total+1))
            if sigma convert -t lucene -p ecs_windows "$f" >/dev/null 2>/tmp/err; then
              echo "  PASS $(basename "$f")"
            else
              echo "  FAIL $(basename "$f"): $(head -n1 /tmp/err)"
              echo "::error file=$f::sigma convert failed: $(head -n1 /tmp/err)"
              fail=$((fail+1))
            fi
          done
          echo "::endgroup::"
          echo "::group::YARA compile"
          for f in 01-hardening-checklist/detection/yara/*.yar; do
            total=$((total+1))
            if yara -w "$f" /dev/null >/dev/null 2>/tmp/err; then
              echo "  PASS $(basename "$f")"
            else
              echo "  FAIL $(basename "$f"): $(head -n1 /tmp/err)"
              echo "::error file=$f::yara compile failed: $(head -n1 /tmp/err)"
              fail=$((fail+1))
            fi
          done
          echo "::endgroup::"
          echo "total=$total fail=$fail"
          if [ "$total" -eq 0 ]; then echo "::error::no detection rules found"; exit 1; fi
          if [ "$fail" -gt 0 ]; then echo "::error::$fail rule(s) failed to convert/compile"; exit 1; fi
          echo "All $total detection rules converted/compiled cleanly."
