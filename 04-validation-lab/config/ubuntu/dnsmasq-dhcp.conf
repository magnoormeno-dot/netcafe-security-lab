# dnsmasq-dhcp.conf  —— 【可选 / OPTIONAL】隔离网"只发 DHCP、不做 DNS"配置
# ============================================================================
# 默认方案是【全静态 IP】(见 99-cafesec-netplan.yaml 与 guest\Set-StaticIP.ps1),
# 更简单、更可控。本文件只在你确实想给隔离网发 DHCP 时才用 —— 完全可选,不装也行。
#
# 安装/启用(仅在 CSL-Wazuh 上,且确认本机已是 10.10.10.10/24 静态地址):
#   sudo cp dnsmasq-dhcp.conf /etc/dnsmasq.d/cafesec-dhcp.conf
#   # Ubuntu Server 上 systemd-resolved 占用 53 端口也无妨——本配置 port=0 不监听 DNS。
#   sudo systemctl enable --now dnsmasq
#   sudo systemctl status dnsmasq
#
# 设计原则(纯防御 / 完全隔离):
#   - 【只做 DHCP】port=0 彻底关闭 DNS 监听:本机不解析、不转发、无上游。
#   - 【不发默认网关】dhcp-option=3 (留空) —— 客户机拿不到 default route,出不去。
#   - 【不发 DNS 服务器】dhcp-option=6 (留空) —— 客户机不会指向任何 DNS。
#   - 仅在隔离网卡上服务,地址池 10.10.10.100-200,避开静态保留段(.10/.20/.31/.32)。
#   注意:dnsmasq 默认会把【自己】当网关(option 3)和 DNS(option 6)下发,
#         所以上面两条"留空覆盖"是隔离的关键,务必保留。
# ============================================================================

# --- 关闭一切 DNS 行为(只留 DHCP)---
port=0                         # 0 = 不监听 53,完全不提供 DNS 服务
no-resolv                      # 不读取 /etc/resolv.conf(无上游 DNS)
no-poll                        # 不轮询 resolv.conf 变化
domain-needed                  # 即便误开 DNS 也不向上游发裸主机名查询(纵深防御)
bogus-priv                     # 同上:私网反查不外泄(纵深防御)

# --- 只绑定隔离网卡,绝不监听其它接口 ---
interface=ens3                 # <-- 改成 `ip link` 查到的真实网卡名(与 netplan 一致)
bind-interfaces                # 只绑定上面声明的接口,不抢占其它网卡
no-dhcp-interface=lo           # 不在回环上跑 DHCP

# --- DHCP 地址池:仅租约,租期短,便于回收 ---
# 池范围避开静态保留:.10=Wazuh .20=Server .31/.32=Client(见 config\lab.psd1)
dhcp-range=10.10.10.100,10.10.10.200,255.255.255.0,1h
dhcp-authoritative             # 本网唯一 DHCP,可立即响应/纠正错误租约

# --- 【隔离关键】不下发网关、不下发 DNS(用具名形式抑制,留空即"不提供")---
# 用 option:router / option:dns 具名形式(dnsmasq man page 文档化的"抑制"语法),
# 比裸数字 dhcp-option=3/6 更不易因手误(如多写逗号)而意外重新下发网关 —— 这是气隙的纵深防御关键。
dhcp-option=option:router      # 默认网关 -> 留空 = 不下发 = 客户机无 default route
dhcp-option=option:dns-server  # DNS 服务器 -> 留空 = 不下发 = 客户机无 DNS
# (不下发 option 119 域搜索 / option 15 域名,保持网络面最小)

# --- 日志(排查租约用,可按需注释)---
log-dhcp                       # 记录每次 DISCOVER/OFFER/REQUEST/ACK
# 租约文件默认在 /var/lib/misc/dnsmasq.leases
